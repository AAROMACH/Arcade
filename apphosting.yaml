# Firebase App Hosting settings for the Aaromach Arcade.
# https://firebase.google.com/docs/app-hosting/configure
# The app is static files served by server.js (no dependencies), so one small instance is plenty.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512
