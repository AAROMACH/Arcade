<style>
/* Layout: two tabs. Games = a wall of cartridges grouped by trade. Leaderboard = a plain standings sheet: game list down the side, one ranked table.
   Inside a game, a slim standings drawer slides in from the right. Single dark shop look. */
:root {
  color-scheme: dark;
  --bg: #121417; --panel: #1b1f25; --line: #2c333c; --fg: #e9ecef; --muted: #9aa3ad; --safety: #ffc21a;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header { display: grid; gap: 14px; padding-bottom: 0; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: 1; color: var(--safety); text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.tabs { display: flex; gap: 4px; border-bottom: 6px solid; border-image: repeating-linear-gradient(-45deg, var(--safety) 0 12px, #111 12px 24px) 6; }
.tabs button { font-family: var(--display); font-size: 15px; color: var(--muted); background: none; border: 0; padding: 10px 14px 8px; cursor: pointer; border-radius: 6px 6px 0 0; }
.tabs button[aria-selected="true"] { color: #111; background: var(--safety); }
button:focus-visible { outline: 3px solid var(--safety); outline-offset: 2px; }
h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
#gamesTab { display: grid; gap: 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.game { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; display: grid; grid-template-rows: 8px auto; transition: transform .12s, border-color .12s; }
.game:hover { transform: translateY(-2px); border-color: var(--c); }
.game i { background: var(--c); }
.game div { padding: 12px 14px 14px; display: grid; gap: 4px; }
.game b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--c); }
.game span { font-size: 14px; line-height: 1.4; }
.game small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.game em { font-style: normal; font-size: 12px; color: var(--muted); }
.game .play { justify-self: start; margin-top: 6px; text-decoration: none; font-family: var(--display); font-size: 13px; color: #111; background: var(--c); border-radius: 6px; padding: 5px 12px; }
.game:hover .play { filter: brightness(1.1); }

/* Standings sheet */
.sheet { display: grid; grid-template-columns: 210px 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pickers { display: grid; align-content: start; border-right: 1px solid var(--line); padding: 6px 0; }
.pickers button { font: inherit; font-size: 15px; font-weight: 700; color: var(--muted); background: none; border: 0; text-align: left; padding: 9px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; }
.pickers button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pickers button[aria-selected="true"] { color: var(--fg); border-left-color: var(--c); background: rgba(255,255,255,.03); }
.standings { padding: 16px 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shead h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--c); }
.shead span { font-size: 13px; color: var(--muted); }
.by { display: flex; gap: 4px; }
.by button { font: inherit; font-weight: 700; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.by button[aria-pressed="true"] { color: #111; background: var(--safety); border-color: var(--safety); }
.lbnote { font-size: 13px; color: var(--muted); margin: 0; }
.namerow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.namerow input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 180px; }
.namerow button { font: inherit; font-weight: 700; color: #111; background: var(--safety); border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.namerow #nameSaved { color: #4cc38a; }
.lbnote .retry { font: inherit; font-weight: 700; color: #111; background: var(--safety); border: 0; border-radius: 6px; padding: 3px 10px; margin-left: 6px; cursor: pointer; }
.posterr { margin: 0; font-size: 13px; color: #ff8a7a; border-left: 3px solid #ff6a55; padding: 4px 8px; background: rgba(255,106,85,.08); border-radius: 4px; }
.acct { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.acct button { font: inherit; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; color: #1f1f1f; background: #fff; border: 1px solid #dadce0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.acct button svg { width: 16px; height: 16px; } .acct #gOut { color: var(--fg); background: var(--panel); border-color: var(--line); }
.acct .keep { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; } .acct #acctMsg { color: var(--fg); }
table.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rank td { padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.rank tr:last-child td { border-bottom: 0; }
.rank .n { width: 34px; color: var(--muted); font-weight: 700; }
.rank tr.p1 .n { color: #ffd257; } .rank tr.p2 .n { color: #cfd6de; } .rank tr.p3 .n { color: #d99a62; }
.rank .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank .who img, .rank .who .av { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.rank .who .av { display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.rank .who .nm { display: grid; min-width: 0; } .rank .who .sub { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.by { flex-wrap: wrap; }
.rank .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .s { text-align: right; font-weight: 700; white-space: nowrap; }
.rank .d { text-align: right; color: var(--muted); font-size: 12px; width: 72px; white-space: nowrap; }
.rank tr.me td { color: var(--safety); }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.playbtn { justify-self: start; font-family: var(--display); font-size: 13px; color: #111; background: var(--c); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
@media (max-width: 680px) {
  .sheet { grid-template-columns: 1fr; }
  .pickers { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
  .pickers button { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; padding: 10px 12px; }
  .pickers button[aria-selected="true"] { border-bottom-color: var(--c); }
  .rank .d { display: none; }
  .standings { padding: 12px; }
}

/* Player + in-game standings drawer */
.player { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.pbar { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.pbar .back { font-family: var(--display); font-size: 13px; color: #111; background: var(--safety); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.pbar strong { font-family: var(--display); font-weight: 400; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar .lbtn { font: inherit; font-weight: 700; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.pbar .lbtn[aria-expanded="true"] { border-color: var(--safety); color: var(--safety); }
.toast { font-size: 13px; color: var(--safety); white-space: nowrap; }
.stage { flex: 1; display: flex; min-height: 0; position: relative; }
.stage iframe { flex: 1; width: 100%; border: 0; background: #000; min-width: 0; }
.drawer { width: 290px; flex: none; border-left: 1px solid var(--line); background: var(--panel); padding: 14px max(14px, env(safe-area-inset-right, 0px)) 14px 14px; overflow-y: auto; display: grid; gap: 10px; align-content: start; }
.drawer h3 { margin: 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.drawer .mine { font-size: 13px; color: var(--muted); }
.drawer .rank td { font-size: 14px; padding: 6px 2px; }
.drawer .rank .d { display: none; }
/* Phones: the bar's buttons go to icons so the game's name fits. */
@media (max-width: 560px) { .pbar { gap: 8px; } .pbar .t { display: none; } .pbar .lbtn { min-width: 36px; height: 34px; padding: 0 9px; font-size: 16px; } .pbar .back { padding: 8px 11px; } }
@media (max-width: 760px) { .drawer { position: absolute; inset: 0 0 0 auto; width: min(320px, 86vw); box-shadow: -10px 0 30px rgba(0,0,0,.5); z-index: 2; } .toast { display: none; } }
/* Game list views */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -6px 0 -4px; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips button { font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; flex: none; }
.chips button[aria-pressed="true"] { color: #111; background: var(--safety); border-color: var(--safety); }
#gameList { display: grid; gap: 22px; }
.game .plays { font-size: 12px; color: var(--muted); }
.emptyv { color: var(--muted); font-size: 14px; margin: 0; }
/* Phones: compact two-up tiles; the whole tile is the button, so the blurb and Play label go. */
@media (max-width: 560px) {
  body { padding-block: 14px; }
  .wrap { gap: 16px; }
  header { gap: 10px; }
  header p { font-size: 13px; }
  #gameList { gap: 18px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .game { grid-template-rows: 5px auto; border-radius: 8px; }
  .game div { padding: 9px 10px 10px; gap: 2px; align-content: start; }
  .game b { font-size: 16px; line-height: 1.1; }
  .game small { font-size: 10px; letter-spacing: .08em; }
  .game span, .game .play { display: none; }
  .game em, .game .plays { font-size: 11px; line-height: 1.3; }
}
@media (prefers-reduced-motion: reduce) { .game { transition: none; } .game:hover { transform: none; } }
</style>

<style id="tapfix">
/* Phones: tapping or holding on the game never selects text or opens the copy / look-up pop-up.
   Text boxes and dropdowns still work normally. */
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, a, canvas, svg, label, [role="button"], [data-id], [data-t], [data-c] { touch-action: manipulation; }
img, svg, canvas { -webkit-user-drag: none; }
</style>

<script>
const GAMES = [
  { id: 'pull-day', t: 'Pull Day', d: 'Route cable runs from the IDF to every drop under par.', k: 'Route puzzle', c: '#5aa9ff', g: 'cab' },
  { id: 'terminate', timed: true, t: 'Terminate', d: 'T568A/B pin order, crimp and test before the pairs untwist.', k: 'Speed & precision', c: '#f07a1a', g: 'cab' },
  { id: 'rough-in', t: 'Rough-In Day', d: 'Memorize the print, place every box before drywall.', k: 'Memory', c: '#e2c79a', g: 'cab' },
  { id: 'lift-panic', t: 'Lift Panic', d: 'Hang cameras from a scissor lift and dodge the warehouse.', k: 'Arcade runner', c: '#ffc21a', g: 'cam' },
  { id: 'coverage', t: 'Coverage', d: 'Aim cameras to cover every zone within NVR channels.', k: 'Placement puzzle', c: '#39d98a', g: 'cam' },
  { id: 'splice', timed: true, t: 'Splice', d: 'Cleave, align and arc-fuse a 12-fiber tray.', k: 'Timing', c: '#7fe0ff', g: 'cam' },
  { id: 'rack-and-stack', t: 'Rack & Stack', d: 'Rack falling gear. Every full row needs a switch.', k: 'Falling blocks', c: '#3ee08f', g: 'ops' },
  { id: 'rack-cleanup', t: 'Rack Cleanup', d: 'Untangle a live rack: tone, map, re-patch. Fail over before you pull the firewall.', k: 'Live puzzle', c: '#5ad1c4', g: 'ops' },
  { id: 'tone-trace', t: 'Tone & Trace', d: 'Find why the drop is dead, then pick the fix.', k: 'Deduction', c: '#ff8a6b', g: 'ops' },
  { id: 'tool-drawer', t: 'Tool Drawer', d: 'Fit every real tool back in the foam. No gaps, nothing left over.', k: 'Packing puzzle', c: '#e2622b', g: 'ops' },
  { id: 'find-the-tool', t: 'Find the Tool', d: 'Dig through the junk tote for the one tool on the work order.', k: 'Hidden object', c: '#ffe9a8', g: 'ops' },
  { id: 'dispatch-board', t: 'Dispatch Board', d: 'Hit the day\'s money goal: send four techs across town before tickets go late, and play the chance cards the phone deals you.', k: 'Management', c: '#c48bff', g: 'ops' },
];
const $ = id => document.getElementById(id);
const G = id => GAMES.find(g => g.id === id);
// ── Game list: All (Jump back in + by trade), Recent, Most played, or one trade. Plays are counted on this device. ──
const CATS = { cab: 'Cabling', cam: 'Cameras & fiber', ops: 'Racks, tools & ops' };
let plays = {}, view = 'all';
try { plays = JSON.parse(localStorage.getItem('arcade:plays') || '{}') || {}; view = localStorage.getItem('arcade:view') || 'all'; } catch {}
function countPlay(id) {
  const p = plays[id] || { n: 0, last: 0 }; p.n++; p.last = Date.now(); plays[id] = p;
  try { localStorage.setItem('arcade:plays', JSON.stringify(plays)); } catch {}
}
const playAgo = t => { const m = (Date.now() - t) / 6e4; return m < 60 ? 'just now' : m < 1440 ? `${Math.floor(m / 60)}h ago` : `${Math.floor(m / 1440)}d ago`; };
function card(x, extra = '') {
  return `<button type="button" class="game" data-id="${x.id}" style="--c:${x.c}"><i></i><div><small>${x.k}</small><b>${x.t}</b><span>${x.d}</span>${extra}<em data-top="${x.id}"></em><u class="play">▶ Play</u></div></button>`;
}
const section = (title, list, extra) => `<section><h2>${title}</h2><div class="grid">${list.map(x => card(x, extra ? extra(x) : '')).join('')}</div></section>`;
const playedLine = x => plays[x.id] ? `<em class="plays">Played ${plays[x.id].n}× · ${playAgo(plays[x.id].last)}</em>` : '';
function renderGames() {
  if (!['all', 'recent', 'most', ...Object.keys(CATS)].includes(view)) view = 'all';
  document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
  const played = GAMES.filter(x => plays[x.id]);
  let html = '';
  if (view === 'all') {
    const recent = played.slice().sort((a, b) => plays[b.id].last - plays[a.id].last).slice(0, 2);
    if (recent.length) html += section('Jump back in', recent, playedLine);
    html += Object.entries(CATS).map(([g, t]) => section(t, GAMES.filter(x => x.g === g))).join('');
  } else if (view === 'recent' || view === 'most') {
    const key = view === 'recent' ? (a, b) => plays[b.id].last - plays[a.id].last : (a, b) => plays[b.id].n - plays[a.id].n || plays[b.id].last - plays[a.id].last;
    html = played.length ? section(view === 'recent' ? 'Recently played' : 'Most played', played.sort(key), playedLine)
      : '<p class="emptyv">Nothing played on this device yet. Pick a game from All.</p>';

<script>
